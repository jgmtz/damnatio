    <path d="M262 168 Q262 118 304 110 Q346 104 362 140 Q330 132 300 142 Q282 150 278 182 Z" fill="#1a120c"/>
    <path d="M300 222 Q330 244 356 228 L352 238 Q326 254 298 236 Z" fill="#1a120c"/>

    <path d="M346 290 Q384 300 404 320 L412 340 L396 346 L380 330 Q350 320 330 312 Z" fill="#c8743a"/>
    <!-- feet -->
    <path d="M232 975 L232 990 L296 990 L286 975 Z M322 975 L326 990 L398 990 L384 975 Z" fill="#c8743a"/>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1024" viewBox="0 0 600 1024">
  <!-- PLACEHOLDER silhouette: augur of the Collegium (toga, curved lituus staff). Facing right. Ground (300,990), head 112-228. -->
